<h1>建置</h1><p>需要 Windows 10+、CMake 3.26+、Qt 6.2+，建議 MSVC。</p>
<pre><code>cmake -S . -B build -G "Visual Studio 17 2022"
cmake --build build --config Release</code></pre>
<p>建置時會自動以 <code>windeployqt</code> 部署 Qt 執行環境，之後從建置輸出資料夾執行即可。</p>
